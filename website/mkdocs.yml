# OpsMini 官网 + 官方文档（Material for MkDocs）
# 7 语言：zh（默认）/ zh-TW / en / ja / ko / th / de

site_name: OpsMini
site_description: 轻量级 Linux 主机运维面板 — 内置 AI 大模型运维 + 标准 REST API
site_url: https://opsmini.com/
repo_url: https://github.com/unixhot/opsmini
repo_name: unixhot/opsmini
edit_uri: ""

copyright: OpsMini@2026 北京速云科技有限公司 · Apache License 2.0

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          link: /zh-TW/
          nav_translations:
            首页: 首頁
            快速开始: 快速開始
            安装部署: 安裝部署
            配置指南: 配置指南
            功能指南: 功能指南
            REST API: REST API
            架构设计: 架構設計
            开发指南: 開發指南
            FAQ: FAQ
            更新日志: 更新日誌
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            快速开始: Quick Start
            安装部署: Installation
            配置指南: Configuration
            功能指南: Features
            REST API: REST API
            架构设计: Architecture
            开发指南: Development
            FAQ: FAQ
            更新日志: Changelog
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            首页: ホーム
            快速开始: クイックスタート
            安装部署: インストール
            配置指南: 設定
            功能指南: 機能
            REST API: REST API
            架构设计: アーキテクチャ
            开发指南: 開発
            FAQ: FAQ
            更新日志: 更新履歴
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            首页: 홈
            快速开始: 빠른 시작
            安装部署: 설치
            配置指南: 구성
            功能指南: 기능
            REST API: REST API
            架构设计: 아키텍처
            开发指南: 개발
            FAQ: FAQ
            更新日志: 변경 로그
        - locale: th
          name: ไทย
          build: true
          nav_translations:
            首页: หน้าแรก
            快速开始: เริ่มต้นใช้งาน
            安装部署: การติดตั้ง
            配置指南: การกำหนดค่า
            功能指南: คุณสมบัติ
            REST API: REST API
            架构设计: สถาปัตยกรรม
            开发指南: การพัฒนา
            FAQ: FAQ
            更新日志: บันทึกการเปลี่ยนแปลง
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            首页: Startseite
            快速开始: Schnellstart
            安装部署: Installation
            配置指南: Konfiguration
            功能指南: Funktionen
            REST API: REST API
            架构设计: Architektur
            开发指南: Entwicklung
            FAQ: FAQ
            更新日志: Änderungsprotokoll

extra:
  alternate:
    - name: 简体中文
      link: /
      lang: zh
    - name: 繁體中文
      link: /zh-TW/
      lang: zh-TW
    - name: English
      link: /en/
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja
    - name: 한국어
      link: /ko/
      lang: ko
    - name: ไทย
      link: /th/
      lang: th
    - name: Deutsch
      link: /de/
      lang: de
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unixhot/opsmini
      name: GitHub

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/home.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - 首页: index.md
  - 快速开始: getting-started/index.md
  - 安装部署: installation/index.md
  - 配置指南: configuration/index.md
  - 功能指南: features/index.md
  - REST API: api/index.md
  - 架构设计: architecture/index.md
  - 开发指南: development/index.md
  - FAQ: faq/index.md
  - 更新日志: changelog/index.md
