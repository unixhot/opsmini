# OpsMini 官网 + 官方文档（Material for MkDocs）
# 7 语言：zh（默认）/ zh-TW / en / ja / ko / th / de

site_name: AI 驱动的单机面板
site_description: 轻量级 Linux 主机运维面板 — 内置 AI 大模型运维 + 标准 REST API
site_url: https://opsmini.com/docs/
repo_url: https://github.com/unixhot/opsmini
repo_name: unixhot/opsmini
edit_uri: ""

copyright: OpsMini@2026 北京速云科技有限公司 · Apache License 2.0

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
