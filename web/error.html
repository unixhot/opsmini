<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__CODE__ - OpsMini</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2733;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{text-align:center;max-width:520px}
  .code{font-size:110px;font-weight:800;line-height:1;background:linear-gradient(135deg,#4f6ef7,#7a5cf0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-2px}
  .title{font-size:22px;font-weight:600;margin-top:12px}
  .desc{font-size:14px;color:#66708a;margin-top:10px;line-height:1.7}
  .btn{display:inline-block;margin-top:28px;padding:11px 28px;border-radius:8px;background:#4f6ef7;color:#fff;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 4px 12px rgba(79,110,247,.3);transition:.15s}
  .btn:hover{background:#3f5de7;transform:translateY(-1px)}
  .brand{font-size:12px;color:#9aa4b8;margin-top:32px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">__CODE__</div>
    <div class="title">__TITLE__</div>
    <div class="desc">__MSG__</div>
    <a class="btn" href="/">返回首页</a>
    <div class="brand">OpsMini · opsmini.com</div>
  </div>
</body>
</html>
