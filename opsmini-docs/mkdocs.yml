extra:
  homepage: https://opsmini.com/
  alternate:
    - name: 简体中文
      link: /docs/
      lang: zh
    - name: 繁體中文
      link: /docs/zh-TW/
      lang: zh-TW
    - name: English
      link: /docs/en/
      lang: en
    - name: 日本語
      link: /docs/ja/
      lang: ja
    - name: 한국어
      link: /docs/ko/
      lang: ko
    - name: ไทย
      link: /docs/th/
      lang: th
    - name: Deutsch
      link: /docs/de/
      lang: de
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unixhot/opsmini
      name: GitHub

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/home.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

