syntax = "proto3";

package agent.v1;

option go_package = "github.com/opsmini/opsmini/internal/agent/pb;agentpb";

// AgentService 是 Agent（被控端）与 Server（控制端）之间的 gRPC 服务。
//
// 通信模型（去 SaltStack 化，2026-09-07 定稿）：
//   - Agent 只主动 outbound 连 Server 单端口（免 SSH、穿透 NAT/防火墙）。
//   - 一条 HTTP/2 多路复用连接同时承载下发流与回传流，无需 SaltStack 式双端口。
//   - Agent 断线后指数退避重连、周期心跳；仅配置 Server 地址 + 端口 + token。
service AgentService {
  // Stream 是 Agent 与 Server 之间的双向流长连接。
  // Agent 主动建立连接后：先发 Register，收到 RegisterAck 后进入工作态；
  // 期间上行心跳/结果/文件确认，下行接收任务与心跳探测。
  rpc Stream(stream AgentMessage) returns (stream ServerMessage);
}

// ===== 上行消息：Agent -> Server =====

message AgentMessage {
  oneof payload {
    Register register = 1;     // 注册
    Heartbeat heartbeat = 2;   // 心跳
    TaskResult result = 3;     // 任务结果回报
    FileChunkAck file_ack = 4; // 文件下发分片确认（断点续传）
    FileChunkData file_data = 5; // 文件拉取的分片数据（Agent -> Server）
    LogTaskResult log_result = 6;       // 日志任务执行/状态回报
    PluginResult plugin_result = 7;     // 插件任务执行/状态回报
  }
}

// ===== 下行消息：Server -> Agent =====

message ServerMessage {
  oneof payload {
    RegisterAck register_ack = 1; // 注册确认
    ExecuteTask execute = 2;       // 执行命令/脚本
    PushFileTask push_file = 3;    // 文件下发（分片）
    Ping ping = 4;                 // 心跳探测
    PullFileTask pull_file = 5;    // 文件拉取（请求 Agent 上传指定路径文件）
    LogTask log_task = 6;          // 日志采集任务下发（filebeat 配置）
    PluginTask plugin_task = 7;    // 插件管理任务下发
  }
}

// Register 注册请求（Agent -> Server）。
message Register {
  string token = 1;     // 认证 token
  string hostname = 2;  // 主机名
  string version = 3;   // Agent 版本
  string os = 4;        // 操作系统，如 linux
  string arch = 5;      // 架构，如 amd64 / arm64
  int32 panel_port = 6; // 面板 Web 端口（默认 8888，用户可改，用于 OpsAnt 免认证跳转）
}

// RegisterAck 注册确认（Server -> Agent）。
message RegisterAck {
  bool ok = 1;
  string message = 2;
  string agent_id = 3; // Server 分配的 Agent ID
}

// Heartbeat 心跳（Agent -> Server）。
message Heartbeat {
  string agent_id = 1;
  int64 timestamp = 2; // Unix 秒
}

// Ping 心跳探测（Server -> Agent）。
message Ping {
  int64 timestamp = 1; // Unix 秒
}

// ExecuteTask 执行命令/脚本任务（Server -> Agent）。
message ExecuteTask {
  string job_id = 1;
  oneof kind {
    CommandSpec command = 2; // 执行命令
    ScriptSpec script = 3;   // 执行脚本
  }
  int32 timeout = 4; // 超时（秒），<=0 使用默认值
}

// CommandSpec 命令执行参数。
message CommandSpec {
  string command = 1; // 命令行（sh -c 执行）
}

// ScriptSpec 脚本执行参数。
message ScriptSpec {
  string script = 1;   // 脚本内容
  string language = 2; // shell | python
}

// PushFileTask 文件分发任务（Server -> Agent），分片传输。
// Server 按序发送多个分片（offset 递增），Agent 收到 last 分片后校验 md5 并回报 FileChunkAck。
message PushFileTask {
  string job_id = 1;
  string path = 2;  // 目标绝对路径（文件=重命名到该路径；目录=放入该目录并保留原文件名）
  string mode = 3;  // 权限（octal 字符串，如 "0755"），空则默认 0644
  int64 size = 4;   // 文件总大小
  string md5 = 5;   // 整文件 MD5
  int64 offset = 6; // 分片偏移（断点续传：Agent 回报已接收字节数，Server 从该处续传）
  bytes chunk = 7;  // 分片数据
  bool last = 8;    // 是否最后一个分片
  string filename = 9;  // 原文件名（path 为目录时，拼接 filename 作为最终文件名）
}

// FileChunkAck 文件分片确认（Agent -> Server），用于断点续传。
message FileChunkAck {
  string job_id = 1;
  int64 received = 2; // 已接收字节数
  string md5 = 3;     // 完成后整文件 MD5（仅 last 分片时有效）
  string error = 4;   // 错误信息（非空表示该分片/文件失败）
}

// TaskResult 任务结果回报（Agent -> Server）。
message TaskResult {
  string job_id = 1;
  string status = 2;    // success | failed | timeout | cancelled
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  int64 duration_ms = 6;
}

// PullFileTask 文件拉取请求（Server -> Agent），要求 Agent 上传指定路径的文件。
message PullFileTask {
  string job_id = 1;
  string path = 2; // 要拉取的文件的绝对路径
}

// FileChunkData 文件拉取的分片数据（Agent -> Server）。
// Agent 按序发送多个分片（offset 递增），last 分片携带 size/md5 供 Server 校验。
message FileChunkData {
  string job_id = 1;
  string path = 2;  // 源文件路径
  int64 size = 3;   // 文件总大小（last 分片时有效，或首分片即知）
  string md5 = 4;   // 整文件 MD5（last 分片时有效）
  int64 offset = 5; // 分片偏移
  bytes chunk = 6;  // 分片数据
  bool last = 7;    // 是否最后一个分片
  string error = 8; // 错误信息（文件不存在/无权限等，非空表示失败）
}

// ===== 日志采集任务下发（OpsAnt -> OpsMini）=====
//
// 一个任务 = 一份 filebeat 配置。content 是原样下发的 YAML，Agent 不做二次
// 加工，只负责落盘到 tasks.d/ 并触发热加载——这样平台侧对 filebeat 与 OpsMini
// 可以下发完全相同的配置，不需要为两种采集器维护两套格式。

// LogTask 日志任务（Server -> Agent）。
message LogTask {
  string job_id = 1;
  string action = 2;    // apply | remove | reload | status
  string task_id = 3;   // 平台侧任务 ID，落到 fields.task_id
  string filename = 4;  // tasks.d 下的文件名（不含路径），apply/remove 时必填
  bytes content = 5;    // 完整 YAML（apply 时必填）
  string sha256 = 6;    // 内容摘要：相同则不重写、不触发 reload（幂等）
  bool strict = 7;      // true = 未知字段导致加载失败；false = 记 warning 继续
}

// LogTaskResult 日志任务结果/状态（Agent -> Server）。
message LogTaskResult {
  string job_id = 1;
  string task_id = 2;
  string status = 3;              // applied | removed | running | failed | unchanged
  string error = 4;
  repeated string warnings = 5;   // 未知字段、路径不存在等
  LogTaskState state = 6;         // status 动作为状态查询时填充
}

// LogTaskState 单个任务的实时采集状态。
// 平台需要它来区分「配置已下发」和「真的在采」：路径写错、权限不足、磁盘满，
// 这三种情况下配置下发都会成功。
message LogTaskState {
  string task_id = 1;
  string input_id = 2;
  string state = 3;          // running | failed | stopped
  int32 files_open = 4;
  int64 bytes_read = 5;
  int64 events_sent = 6;
  int64 events_dropped = 7;
  int64 queue_depth = 8;
  string last_error = 9;
  string output = 10;
}

// ===== 插件管理任务下发（OpsAnt -> OpsMini）=====
//
// 包由 Agent 主动 HTTP 拉取（可断点续传、适配 NAT），而不是 Server 推流：
// 插件包通常几 MB，走 gRPC 流会把已有的文件分发通道和插件生命周期搅在一起。

// PluginTask 插件任务（Server -> Agent）。
message PluginTask {
  string job_id = 1;
  string action = 2;       // install | upgrade | remove | enable | disable | restart | status
  string plugin_id = 3;
  string version = 4;      // 期望版本（仅用于回报核对）
  string source_url = 5;   // 包下载地址（http/https），install/upgrade 必填
  string sha256 = 6;       // 包摘要，Agent 校验后才安装
  string signature = 7;    // ed25519 签名（base64），配置了公钥时校验
  string config = 8;       // 插件配置 JSON，原样写入插件目录
  bool keep_data = 9;      // remove 时是否保留数据目录
}

// PluginResult 插件任务结果（Agent -> Server）。
message PluginResult {
  string job_id = 1;
  string plugin_id = 2;
  string status = 3;    // ok | failed
  string error = 4;
  string version = 5;
  string state = 6;     // running | stopped | failed | installed | removed
}
