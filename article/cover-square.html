<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
body{width:1080px;height:1080px;overflow:hidden;}
.stage{position:relative;width:1080px;height:1080px;background:linear-gradient(160deg,#ffffff 0%,#eff6ff 60%,#dbeafe 100%);text-align:center;}
.logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:430px;}
.t1{position:absolute;left:0;right:0;top:400px;font-size:92px;font-weight:800;color:#0f172a;letter-spacing:4px;}
.t2{position:absolute;left:0;right:0;top:530px;font-size:92px;font-weight:800;color:#2563eb;letter-spacing:4px;}
.sub{position:absolute;left:0;right:0;top:700px;font-size:34px;color:#475569;letter-spacing:2px;}
.pill{position:absolute;left:50%;top:800px;transform:translateX(-50%);background:#2563eb;color:#fff;font-size:30px;font-weight:600;padding:16px 44px;border-radius:999px;letter-spacing:2px;white-space:nowrap;}
.site{position:absolute;left:0;right:0;top:960px;font-size:26px;color:#94a3b8;letter-spacing:2px;}

<body>
<div class="stage">
  <img class="logo" src="../opsmini-site/assets/logo.png">
  <div class="t1">把 AI 装进服务器</div>
  <div class="t2">让它自己运维自己</div>
  <div class="sub">主机上的 AI 运维 Agent · 单二进制 · 开源</div>
  <div class="pill">会动手 · 划得住线 · 数据不出本机</div>
  <div class="site">opsmini.com</div>
</div>
</body>
</html>
